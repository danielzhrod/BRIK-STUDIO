<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Vista previa de la landing page de Glow by Sofy">
  <title>Glow by Sofy — Salón de belleza premium</title>

  <defs>
    <linearGradient id="gLeft" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6b5a4e"/><stop offset="1" stop-color="#2a2320"/>
    </linearGradient>
    <linearGradient id="gRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3b33"/><stop offset="1" stop-color="#12100e"/>
    </linearGradient>
    <linearGradient id="gVeil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0c0a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#0d0c0a" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#0d0c0a" stop-opacity="0.88"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#111111"/>

  <!-- ===== Fondo: dos planos fotográficos ===== -->
  <rect x="0" y="0" width="980" height="1000" fill="url(#gLeft)"/>
  <rect x="980" y="0" width="620" height="1000" fill="url(#gRight)"/>

  <!-- Ramo de flores insinuado a la izquierda -->
  <circle cx="150" cy="150" r="52" fill="#b3617f" opacity="0.55"/>
  <circle cx="245" cy="105" r="44" fill="#c98098" opacity="0.5"/>
  <circle cx="330" cy="175" r="40" fill="#9c5470" opacity="0.45"/>
  <circle cx="205" cy="215" r="46" fill="#d9a0b4" opacity="0.4"/>
  <path d="M120 250 Q220 300 300 250 L300 420 Q210 470 120 420 Z" fill="#a8894f" opacity="0.35"/>
  <!-- Marco de cuadro insinuado -->
  <rect x="640" y="560" width="230" height="290" rx="8" fill="#e6ddd2" opacity="0.20"/>
  <!-- Silueta de melena a la derecha -->
  <path d="M1250 420 q120 -140 250 0 q40 200 -20 400 h-220 q-60 -200 -10 -400z" fill="#5a3f2c" opacity="0.55"/>
  <!-- Cartel dorado del fondo derecho -->
  <text x="1290" y="120" font-family="Georgia, serif" font-size="72" font-weight="700" fill="#c9a227" opacity="0.55">HA NO</text>

  <rect x="0" y="0" width="1600" height="1000" fill="url(#gVeil)"/>

  <!-- ===== Barra de navegación ===== -->
  <text x="170" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="3" fill="#ffffff">GLOW</text>
  <text x="270" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-style="italic" fill="#e8e2d8">by Sofy</text>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff" opacity="0.9">
    <text x="620" y="60">Inicio</text>
    <text x="700" y="60">Ambiente</text>
    <text x="812" y="60">Servicios</text>
    <text x="912" y="60">Galería</text>
    <text x="1000" y="60">Contacto</text>
  </g>
  <rect x="1330" y="28" width="150" height="52" fill="#161513"/>
  <text x="1405" y="60" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff">RESERVAR</text>

  <!-- ===== Eyebrow ===== -->
  <line x1="42" y1="296" x2="86" y2="296" stroke="#c9b99a" stroke-width="1.5"/>
  <text x="100" y="302" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" letter-spacing="4.5" fill="#c9b99a">SALÓN DE BELLEZA PREMIUM</text>

  <!-- ===== Titular ===== -->
  <text x="42" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#ffffff">El arte de</text>
  <text x="42" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-style="italic" fill="#c9b99a">brillar.</text>

  <!-- ===== Subtítulo ===== -->
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="20" fill="#ffffff" opacity="0.88">
    <text x="42" y="662">Alaciados, color, nail art y maquillaje artístico con la precisión de</text>
    <text x="42" y="696">un estudio y la calidez de una amiga.</text>
  </g>

  <!-- ===== Botones ===== -->
  <rect x="42" y="752" width="228" height="60" fill="#1a1917"/>
  <text x="156" y="789" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff">RESERVAR CITA</text>
  <rect x="292" y="752" width="240" height="60" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2"/>
  <text x="396" y="789" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff">VER SERVICIOS</text>
  <text x="492" y="787" font-family="Inter, sans-serif" font-size="16" fill="#ffffff">↗</text>

  <!-- ===== Indicador inferior derecho ===== -->
  <text x="1500" y="912" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" fill="#ffffff" opacity="0.7">⌄</text>
  <text x="1500" y="950" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="12" letter-spacing="3" fill="#ffffff" opacity="0.7">DESCUBRE MÁS</text>
</svg>
