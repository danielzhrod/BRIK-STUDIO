  <text x="616" y="722" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#4285F4">G</text>
  <text x="648" y="723" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" fill="#FFC93C">★★★★★</text>
