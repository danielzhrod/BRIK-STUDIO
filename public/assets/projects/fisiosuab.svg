  <circle cx="634" cy="202" r="6" fill="#E8907C"/>
  <text x="650" y="208" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" fill="#ffffff">Clínica de Fisioterapia · Valladolid</text>

  <!-- ===== Titular ===== -->
  <text x="610" y="330" font-family="Inter, 'Segoe UI', sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#ffffff">Tu recuperación,</text>
  <text x="610" y="418" font-family="Inter, 'Segoe UI', sans-serif" font-size="76" font-weight="800" letter-spacing="-2.5" fill="#EFA491">nuestra prioridad</text>

