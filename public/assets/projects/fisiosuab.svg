<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Vista previa de la landing page de FisioSuab">
  <title>FisioSuab — Clínica de fisioterapia</title>

  <defs>
    <linearGradient id="fs-hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D5C8"/>
      <stop offset="1" stop-color="#F4BEAF"/>
    </linearGradient>
    <linearGradient id="fs-blob" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4758A"/>
      <stop offset="1" stop-color="#7B3348"/>
    </linearGradient>
    <clipPath id="fs-round">
      <rect x="820" y="168" width="700" height="500" rx="32"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- ===== Barra de navegación ===== -->
  <rect x="0" y="0" width="1600" height="92" fill="#FFFFFF"/>
  <line x1="0" y1="92" x2="1600" y2="92" stroke="#F0E4E4" stroke-width="1"/>
  <circle cx="96" cy="46" r="15" fill="#7B3348"/>
  <text x="122" y="53" font-family="Inter, 'Segoe UI', sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#5C2A3C">FISIOSUAB</text>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="15" fill="#9C5470">
    <text x="1000" y="52">Servicios</text>
    <text x="1114" y="52">Equipo</text>
    <text x="1206" y="52">Contacto</text>
  </g>
  <rect x="1330" y="26" width="176" height="42" rx="21" fill="#7B3348"/>
  <text x="1418" y="53" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Pedir cita</text>

  <!-- ===== Hero: columna de texto ===== -->
  <rect x="80" y="186" width="272" height="38" rx="19" fill="#F7D5C8"/>
  <circle cx="105" cy="205" r="5" fill="#E8907C"/>
  <text x="122" y="211" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="600" letter-spacing="0.6" fill="#7B3348">Fisioterapia en Valladolid</text>

  <text x="80" y="330" font-family="Inter, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#5C2A3C">Tu recuperación,</text>
  <text x="80" y="410" font-family="Inter, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-2" fill="#C4758A">nuestra prioridad</text>

  <g fill="#9C5470" opacity="0.5">
    <rect x="80" y="460" width="600" height="12" rx="6"/>
    <rect x="80" y="488" width="540" height="12" rx="6"/>
    <rect x="80" y="516" width="420" height="12" rx="6"/>
  </g>

  <rect x="80" y="572" width="212" height="58" rx="29" fill="#7B3348"/>
  <text x="186" y="608" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Reservar cita</text>
  <rect x="308" y="572" width="196" height="58" rx="29" fill="none" stroke="#E8B4C0" stroke-width="2"/>
  <text x="406" y="608" text-anchor="middle" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#7B3348">Servicios</text>

  <!-- ===== Hero: imagen ===== -->
  <g clip-path="url(#fs-round)">
    <rect x="820" y="168" width="700" height="500" fill="url(#fs-hero)"/>
    <circle cx="1230" cy="470" r="230" fill="url(#fs-blob)" opacity="0.55"/>
    <circle cx="1080" cy="300" r="120" fill="#FFFFFF" opacity="0.28"/>
    <path d="M820 560 Q1010 470 1200 545 T1520 500 V668 H820 Z" fill="#5C2A3C" opacity="0.35"/>
  </g>
  <!-- Tarjeta flotante sobre la imagen -->
  <rect x="856" y="536" width="290" height="96" rx="18" fill="#FFFFFF"/>
  <circle cx="900" cy="584" r="20" fill="#F7D5C8"/>
  <path d="M892 584 l6 7 l12 -14" fill="none" stroke="#7B3348" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="934" y="566" width="150" height="11" rx="5.5" fill="#5C2A3C" opacity="0.85"/>
  <rect x="934" y="590" width="108" height="10" rx="5" fill="#9C5470" opacity="0.45"/>

  <!-- ===== Tarjetas de servicios ===== -->
  <g>
    <rect x="80" y="742" width="452" height="196" rx="20" fill="#FFFFFF" stroke="#F0E4E4" stroke-width="2"/>
    <rect x="116" y="778" width="44" height="44" rx="12" fill="#F7D5C8"/>
    <rect x="116" y="846" width="200" height="14" rx="7" fill="#5C2A3C" opacity="0.85"/>
    <rect x="116" y="876" width="330" height="10" rx="5" fill="#9C5470" opacity="0.4"/>
    <rect x="116" y="898" width="264" height="10" rx="5" fill="#9C5470" opacity="0.4"/>
  </g>
  <g>
    <rect x="574" y="742" width="452" height="196" rx="20" fill="#FFFFFF" stroke="#F0E4E4" stroke-width="2"/>
    <rect x="610" y="778" width="44" height="44" rx="12" fill="#F4BEAF"/>
    <rect x="610" y="846" width="230" height="14" rx="7" fill="#5C2A3C" opacity="0.85"/>
    <rect x="610" y="876" width="330" height="10" rx="5" fill="#9C5470" opacity="0.4"/>
    <rect x="610" y="898" width="288" height="10" rx="5" fill="#9C5470" opacity="0.4"/>
  </g>
  <g>
    <rect x="1068" y="742" width="452" height="196" rx="20" fill="#7B3348"/>
    <rect x="1104" y="778" width="44" height="44" rx="12" fill="#FFFFFF" opacity="0.2"/>
    <rect x="1104" y="846" width="184" height="14" rx="7" fill="#FFFFFF" opacity="0.9"/>
    <rect x="1104" y="876" width="330" height="10" rx="5" fill="#FFFFFF" opacity="0.4"/>
    <rect x="1104" y="898" width="248" height="10" rx="5" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
