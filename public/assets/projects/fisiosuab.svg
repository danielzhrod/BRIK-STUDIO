    <text x="792" y="49">Servicios</text>
    <text x="900" y="49">Instalaciones</text>
    <text x="1040" y="49">Reseñas</text>
    <text x="1144" y="49">Contacto</text>
    <text x="1250" y="49">Ubicación</text>
    <text x="1368" y="49">Instagram</text>
  </g>
  <rect x="1478" y="24" width="140" height="38" rx="19" fill="#ffffff" opacity="0.16"/>
  <circle cx="1502" cy="43" r="7" fill="none" stroke="#ffffff" stroke-width="1.6"/>
  <text x="1516" y="49" font-family="Inter, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#ffffff">603 92 69 54</text>

  <!-- ===== Etiqueta superior ===== -->
