  <rect x="610" y="596" width="318" height="58" rx="29" fill="#8E3F55"/>
  <circle cx="646" cy="625" r="9" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  <text x="668" y="632" font-family="Inter, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ffffff">Reservar cita — 603 92 69 54</text>
  <rect x="948" y="596" width="192" height="58" rx="29" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.5"/>
