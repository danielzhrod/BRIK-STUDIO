  <text x="960" y="800" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" fill="#ffffff" opacity="0.8">Pacientes tratados</text>
  <line x1="1130" y1="770" x2="1130" y2="806" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="1160" y="800" font-family="Inter, 'Segoe UI', sans-serif" font-size="40" font-weight="800" fill="#ffffff">5.0★</text>
  <text x="1256" y="800" font-family="Inter, 'Segoe UI', sans-serif" font-size="15" fill="#ffffff" opacity="0.8">Google Reviews</text>

