<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Vista previa de la landing page de FisioSuab">
  <title>FisioSuab — Clínica de fisioterapia en Valladolid</title>

  <defs>
    <!-- Tres franjas fotográficas insinuadas bajo el velo burdeos -->
    <linearGradient id="ph1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d7f86"/><stop offset="1" stop-color="#4a3a42"/>
    </linearGradient>
    <linearGradient id="ph2" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#b9a8ac"/><stop offset="1" stop-color="#6b555f"/>
    </linearGradient>
    <linearGradient id="ph3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8a86"/><stop offset="1" stop-color="#5a4046"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C2A3C" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#5C2A3C" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#5C2A3C"/>

  <!-- ===== Fondo: tres imágenes en franjas ===== -->
  <rect x="0"    y="0" width="534" height="1000" fill="url(#ph1)"/>
  <rect x="534"  y="0" width="534" height="1000" fill="url(#ph2)"/>
  <rect x="1068" y="0" width="532" height="1000" fill="url(#ph3)"/>
  <!-- Formas insinuando el equipo de ecografía y las pesas -->
  <circle cx="270" cy="640" r="150" fill="#3d2f35" opacity="0.5"/>
  <rect x="150" y="330" width="300" height="190" rx="10" fill="#2f2f3a" opacity="0.55"/>
  <circle cx="1240" cy="560" r="120" fill="#7d9c5a" opacity="0.35"/>
  <circle cx="1420" cy="700" r="140" fill="#c96a52" opacity="0.30"/>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#veil)"/>

  <!-- ===== Barra de navegación ===== -->
  <rect x="352" y="22" width="42" height="42" rx="12" fill="#ffffff" opacity="0.92"/>
  <path d="M373 34c5 6 5 12 0 18-5-6-5-12 0-18z" fill="#7B3348"/>
  <text x="406" y="52" font-family="Inter, 'Segoe UI', sans-serif" font-size="21" font-weight="800" letter-spacing="0.5" fill="#ffffff">FISIOSUAB</text>
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="15" fill="#ffffff" opacity="0.88">
